# Release data contract: canonical backend v0.8.7 keeps complete match detail while capping coach lookup latency.
name: NinetyPlus
options:
  bundleIdPrefix: com.ninetyplus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.app
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 94
targets:
  NinetyPlus:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme:
      testTargets:
        - NinetyPlusUITests
    settings:
      base:
        PRODUCT_NAME: NinetyPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: '90+'
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NINETYPLUS_BACKEND_URL: 'https://ninetyplus-ios-production.up.railway.app/'
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  NinetyPlusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NinetyPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NinetyPlus
