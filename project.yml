# 90+ 2.0 integrated product branch. Build 105 remains the rollback baseline.
name: NinetyPlus
options:
  bundleIdPrefix: com.ninetyplus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.app
    MARKETING_VERSION: 2.0.1
    CURRENT_PROJECT_VERSION: 202
targets:
  NinetyPlus:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: NinetyPlusWidgets
    scheme:
      testTargets:
        - NinetyPlusUITests
    settings:
      base:
        PRODUCT_NAME: NinetyPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: '90+'
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NINETYPLUS_BACKEND_URL: 'https://ninetyplus-ios-production.up.railway.app/'
        NINETYPLUS_FREE_GATEWAY_URL: 'https://ninetyplus-free.i20sss20.workers.dev'
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleURLTypes:
          - CFBundleURLName: com.ninetyplus.app
            CFBundleURLSchemes: [ninetyplus]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCalendarsWriteOnlyAccessUsageDescription: 'يستخدم 90+ إذن التقويم فقط عندما تختار إضافة مباراة إلى تقويمك.'
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  NinetyPlusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.app.widgets
        CURRENT_PROJECT_VERSION: 202
        MARKETING_VERSION: 2.0.1
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: '90+ Widgets'
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NinetyPlusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NinetyPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NinetyPlus
