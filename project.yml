name: NinetyPlus
options:
  bundleIdPrefix: com.ninetyplus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.ninetyplus.app
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 61
targets:
  NinetyPlus:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: NinetyPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: '90+'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: Sources/App/Info.plist
      properties:
        NINETYPLUS_BACKEND_URL: 'https://ninetyplus-ios-production.up.railway.app/'
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
