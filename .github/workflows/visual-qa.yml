name: iPhone visual and live-service QA
# Final integrated 2.0 visual gate: keep this workflow aligned with release transforms.
on:
  workflow_dispatch:
  push:
    branches: [main, v2-all-at-once]
    paths: ['Sources/**', 'Shared/**', 'Widgets/**', 'UITests/**', 'Tests/**', 'project.yml', '.github/workflows/visual-qa.yml', 'scripts/**']
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic release UI fixes
        run: |
          python3 scripts/apply_release_ui_fixes.py
          python3 scripts/apply_match_metadata_fixes.py
          python3 scripts/apply_lineup_ui_fixes.py
          python3 scripts/apply_search_resilience_fixes.py
          python3 scripts/apply_canonical_reindex_fixes.py
          python3 scripts/apply_navigation_reliability_fixes.py
          python3 scripts/apply_popular_app_ux_fixes.py
          python3 scripts/apply_data_resilience_fixes.py
          python3 scripts/apply_build100_product_polish.py
          python3 scripts/apply_v2_all_at_once.py
          python3 scripts/apply_v2_final_polish.py
      - name: Verify 2.0 product wiring
        run: |
          grep -q 'V2PowerCenterView' Sources/Views/V2Personalization.swift
          grep -q 'home.quick.live' Sources/Views/V2HomeView.swift
          grep -q 'team.snapshot' Sources/Views/V2Discovery.swift
          grep -q 'match.team.home' Sources/Views/V2MatchExperience.swift
          grep -q 'englishDigits' Sources/Core/SportsCopy.swift
          grep -q 'v2.recentSearches' Sources/Views/V2Discovery.swift
          grep -q 'ar-SA-u-ca-gregory-nu-latn' Sources/Core/PublicLeagueTable.swift
          grep -q 'MARKETING_VERSION: 2.0.0' project.yml
          grep -q 'NinetyPlusWidgets' project.yml
      - name: Audit commercial source hygiene
        run: python3 scripts/audit_commercial_hygiene.py
      - name: Test RSS images and dates
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/EditorialFeed.swift Tests/EditorialFeedTests.swift -o /tmp/editorial-tests
          /tmp/editorial-tests
      - name: Test player decoding and English digits
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/EnglishDigits.swift Sources/Core/PlayerSeasonData.swift Sources/Core/SportsCopy.swift Tests/PlayerSeasonDataTests.swift -o /tmp/player-tests
          /tmp/player-tests
      - name: Check actual dashboard sources
        run: |
          mkdir -p evidence
          python3 scripts/probe_dashboard.py > evidence/source-check.json
          cat evidence/source-check.json
      - name: Probe production match detail end-to-end
        run: |
          python3 scripts/probe_match_detail.py
          cat evidence/production-match-detail.json
      - name: Test actual current-season table and identifiers
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/EnglishDigits.swift Sources/Core/PublicLeagueTable.swift Tests/PublicSourceTests.swift -o /tmp/public-tests
          if [ -s evidence/public-table.json ]; then /tmp/public-tests evidence/public-table.json; else /tmp/public-tests; fi
      - name: Upload source diagnostics early
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-2.0-Data-Diagnostics
          path: evidence/*.json
          retention-days: 7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate 90+ app icon
        run: swift scripts/generate_app_icon.swift
      - name: Generate project
        run: xcodegen generate
      - name: Choose simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          devices=json.load(open('/tmp/devices.json'))['devices']
          choices=[d for runtime, values in devices.items() if 'iOS-18' in runtime for d in values if 'iPhone' in d['name']]
          if not choices: choices=[d for values in devices.values() for d in values if 'iPhone' in d['name']]
          device=next((d for d in choices if d['name']=='iPhone 16 Pro'), choices[0])
          print('SIMULATOR_ID='+device['udid'])
          PY
      - name: Build app and UI tests before boot
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NinetyPlus.xcodeproj -scheme NinetyPlus -configuration Debug -destination "id=$SIMULATOR_ID" -derivedDataPath visual-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee evidence/ui-build.log
      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Run Arabic UI journey with real network data
        run: |
          set -o pipefail
          xcodebuild test-without-building -project NinetyPlus.xcodeproj -scheme NinetyPlus -configuration Debug -destination "id=$SIMULATOR_ID" -derivedDataPath visual-build -resultBundlePath evidence/VisualQA.xcresult -only-testing:NinetyPlusUITests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee evidence/ui-test.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d evidence/VisualQA.xcresult ]; then xcrun xcresulttool export attachments --path evidence/VisualQA.xcresult --output-path evidence/screenshots || true; fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-2.0-Visual-QA
          path: evidence/
          retention-days: 14
      - name: Upload exact tested source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-2.0-Tested-Source
          path: |
            Sources/
            Shared/
            Widgets/
            Tests/
            UITests/
            project.yml
          retention-days: 7
