name: Public sports source diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-diagnostics.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public sources
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, concurrent.futures, xml.etree.ElementTree as ET, re, datetime, pathlib
          feeds = {
            'sky-sport': 'https://www.skynewsarabia.com/web/rss/sport.xml',
            'alarabiya-sport': 'https://www.alarabiya.net/.mrss/ar/sport.xml',
            'bbc-sport': 'https://feeds.bbci.co.uk/arabic/sport/rss.xml',
            'hihi2': 'https://hihi2.com/feed',
            'hespress-sport': 'https://www.hespress.com/sport/feed',
            'france24-sport': 'https://www.france24.com/ar/رياضة/rss',
            'espn-saudi-standings': 'https://site.web.api.espn.com/apis/v2/sports/soccer/ksa.1/standings',
            'espn-saudi-scoreboard': 'https://site.api.espn.com/apis/site/v2/sports/soccer/ksa.1/scoreboard',
            'espn-saudi-teams': 'https://site.api.espn.com/apis/site/v2/sports/soccer/ksa.1/teams',
          }
          def fetch(url):
            parts = urllib.parse.urlsplit(url)
            url = urllib.parse.urlunsplit((parts.scheme,parts.netloc,urllib.parse.quote(parts.path,safe='/%'),parts.query,''))
            req = urllib.request.Request(url, headers={'User-Agent':'NinetyPlus-SourceCheck/1.0', 'Accept':'*/*'})
            with urllib.request.urlopen(req, timeout=15) as r: return r.status,r.read(4000000),dict(r.headers)
          def inspect(pair):
            name,url = pair
            out = {'name':name,'url':url}
            try:
              status,data,headers=fetch(url); out['status']=status
              pathlib.Path('evidence/'+name+('.json' if name.startswith('espn') else '.xml')).write_bytes(data)
              if name.startswith('espn'):
                value=json.loads(data); out.update({'keys':list(value), 'season':value.get('season'), 'name':name,'displayName':value.get('name')})
              else:
                root=ET.fromstring(data); items=root.findall('.//item'); out['items']=len(items)
                for item in items[:3]:
                  out.setdefault('samples',[]).append({'title':item.findtext('title'),'date':item.findtext('pubDate'),'link':item.findtext('link')})
                images=[]
                for item in items:
                  candidates=[n.attrib.get('url') for n in item.iter() if n.tag.endswith(('thumbnail','enclosure','content'))]
                  candidates += re.findall(r'<img[^>]+src=[\"\x27]([^\"\x27]+)', ''.join(item.itertext()))
                  images.extend([v for v in candidates if v and v.startswith(('https://','http://'))])
                out['images']=len(images)
                if images:
                  s,d,h=fetch(images[0]); out['firstImage']={'status':s,'bytes':len(d),'type':h.get('Content-Type'), 'url':images[0]}
            except Exception as e: out['error']=str(e)
            return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(inspect,feeds.items()))
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results}
          pathlib.Path('evidence/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-Public-Source-Diagnostics
          path: evidence/
          retention-days: 7
