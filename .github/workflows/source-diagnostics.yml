name: Public sports source diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-diagnostics.yml', 'scripts/probe_match_detail.py', 'scripts/probe_provider_queries.py', 'scripts/test_probe_provider_queries.py']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test provider diagnostic outcomes without network requests
        run: python3 -m unittest discover -s scripts -p 'test_probe_provider_queries.py' -v
      - name: Verify canonical completed-match detail in production
        run: python3 scripts/probe_match_detail.py
      - name: Report provider availability and validate permitted queries
        run: python3 scripts/probe_provider_queries.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NinetyPlus-Production-Data-QA
          path: evidence/
          retention-days: 7
