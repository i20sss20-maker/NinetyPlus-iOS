name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate 90+ app icon
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          NSColor(calibratedRed: 0.012, green: 0.055, blue: 0.065, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()

          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .center

          let font90 = NSFont.systemFont(ofSize: 360, weight: .black)
          let fontPlus = NSFont.systemFont(ofSize: 300, weight: .black)
          let white = NSColor(calibratedWhite: 0.97, alpha: 1)
          let green = NSColor(calibratedRed: 0.04, green: 0.92, blue: 0.48, alpha: 1)

          let attrs90: [NSAttributedString.Key: Any] = [.font: font90, .foregroundColor: white, .paragraphStyle: paragraph]
          let attrsPlus: [NSAttributedString.Key: Any] = [.font: fontPlus, .foregroundColor: green, .paragraphStyle: paragraph]

          NSString(string: "90").draw(in: NSRect(x: 105, y: 315, width: 590, height: 410), withAttributes: attrs90)
          NSString(string: "+").draw(in: NSRect(x: 605, y: 350, width: 300, height: 340), withAttributes: attrsPlus)

          image.unlockFocus()
          guard let tiff = image.tiffRepresentation,
                let rep = NSBitmapImageRep(data: tiff),
                let png = rep.representation(using: .png, properties: [:]) else {
            fatalError("Unable to create app icon")
          }
          try png.write(to: URL(fileURLWithPath: "Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"))
          SWIFT
          swift /tmp/make_icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project NinetyPlus.xcodeproj \
            -scheme NinetyPlus \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload NinetyPlus-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NinetyPlus.app Payload/
          zip -qry NinetyPlus-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-unsigned-IPA
          path: NinetyPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
