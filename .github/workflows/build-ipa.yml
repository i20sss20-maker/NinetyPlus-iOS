name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate 90+ app icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          out='Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          img=Image.new('RGB',(1024,1024),(4,16,19))
          d=ImageDraw.Draw(img)
          try:
              f90=ImageFont.truetype('/System/Library/Fonts/Supplemental/Arial Bold Italic.ttf', 360)
              fp=ImageFont.truetype('/System/Library/Fonts/Supplemental/Arial Bold.ttf', 300)
          except:
              f90=ImageFont.load_default(); fp=ImageFont.load_default()
          d.rounded_rectangle((40,40,984,984), radius=210, fill=(3,19,22))
          d.text((155,290),'90',font=f90,fill=(245,248,248))
          d.text((650,285),'+',font=fp,fill=(10,235,122))
          img.save(out)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project NinetyPlus.xcodeproj \
            -scheme NinetyPlus \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload NinetyPlus-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NinetyPlus.app Payload/
          zip -qry NinetyPlus-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-unsigned-IPA
          path: NinetyPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
