name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, v2-all-at-once]
    paths-ignore:
      - 'backend/**'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic release UI fixes
        run: |
          python3 scripts/apply_release_ui_fixes.py
          python3 scripts/apply_match_metadata_fixes.py
          python3 scripts/apply_lineup_ui_fixes.py
          python3 scripts/apply_search_resilience_fixes.py
          python3 scripts/apply_canonical_reindex_fixes.py
          python3 scripts/apply_navigation_reliability_fixes.py
          python3 scripts/apply_popular_app_ux_fixes.py
          python3 scripts/apply_data_resilience_fixes.py
          python3 scripts/apply_build100_product_polish.py
          python3 scripts/apply_v2_all_at_once.py
          python3 scripts/apply_v2_final_polish.py

      - name: Verify 2.0 product wiring
        run: |
          grep -q 'V2PowerCenterView' Sources/Views/V2Personalization.swift
          grep -q 'home.quick.live' Sources/Views/V2HomeView.swift
          grep -q 'team.snapshot' Sources/Views/V2Discovery.swift
          grep -q 'match.team.home' Sources/Views/V2MatchExperience.swift
          grep -q 'englishDigits' Sources/Core/SportsCopy.swift
          grep -q 'v2.recentSearches' Sources/Views/V2Discovery.swift
          grep -q 'ar-SA-u-ca-gregory-nu-latn' Sources/Core/PublicLeagueTable.swift
          grep -q 'MARKETING_VERSION: 2.0.0' project.yml
          grep -q 'NSSupportsLiveActivities: true' project.yml
          grep -q 'NinetyPlusWidgets' project.yml

      - name: Audit commercial source hygiene
        run: python3 scripts/audit_commercial_hygiene.py

      - name: Test English digit policy
        run: |
          cat > /tmp/digits.swift <<'SWIFT'
          import Foundation
          @main struct DigitsTest {
              static func main() {
                  precondition("١٢٣٤٥٦٧٨٩٠".englishDigits == "1234567890")
                  precondition("۲۰۲۶".englishDigits == "2026")
                  precondition(EnglishDigits.integer(90) == "90")
              }
          }
          SWIFT
          swiftc -parse-as-library Sources/Core/EnglishDigits.swift /tmp/digits.swift -o /tmp/digits-test
          /tmp/digits-test

      - name: Test page loading state
        run: |
          swiftc -parse-as-library Sources/Core/PageResource.swift Tests/PageResourceTests.swift -o /tmp/ninetyplus-state-tests
          /tmp/ninetyplus-state-tests

      - name: Test football response validation
        run: |
          swiftc -parse-as-library Sources/Core/FootballResponseGuard.swift Tests/FootballResponseGuardTests.swift -o /tmp/ninetyplus-response-tests
          /tmp/ninetyplus-response-tests

      - name: Test match center partial loading and live policy
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/PageResource.swift Sources/Core/MatchCenterProgress.swift Tests/MatchCenterProgressTests.swift -o /tmp/ninetyplus-match-tests
          /tmp/ninetyplus-match-tests

      - name: Test For You loading and match selection
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/PageResource.swift Sources/Core/ForYouProgress.swift Tests/ForYouProgressTests.swift -o /tmp/ninetyplus-for-you-tests
          /tmp/ninetyplus-for-you-tests

      - name: Test player decoding, season labels and Arabic copy
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/EnglishDigits.swift Sources/Core/PlayerSeasonData.swift Sources/Core/SportsCopy.swift Tests/PlayerSeasonDataTests.swift -o /tmp/ninetyplus-player-tests
          /tmp/ninetyplus-player-tests

      - name: Test service probe safeguards
        run: python3 -m unittest discover -s Tests -p 'test_service_probe.py' -v

      - name: Read-only production search probe
        continue-on-error: true
        run: python3 scripts/probe_service.py

      - name: Upload service probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-Service-Probe
          path: /tmp/ninetyplus-service-probe.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate 90+ app icon
        run: swift scripts/generate_app_icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project NinetyPlus.xcodeproj \
            -scheme NinetyPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload NinetyPlus-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NinetyPlus.app Payload/
          zip -qry NinetyPlus-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-2.0-unsigned-IPA
          path: NinetyPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
