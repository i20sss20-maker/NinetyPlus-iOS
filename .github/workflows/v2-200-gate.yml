name: 90+ 200-feature gate

on:
  push:
    branches: [v2-200-features]
  workflow_dispatch:

concurrency:
  group: v2-200-features-gate
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply release transforms
        run: |
          python3 scripts/apply_release_ui_fixes.py
          python3 scripts/apply_match_metadata_fixes.py
          python3 scripts/apply_lineup_ui_fixes.py
          python3 scripts/apply_search_resilience_fixes.py
          python3 scripts/apply_canonical_reindex_fixes.py
          python3 scripts/apply_navigation_reliability_fixes.py
          python3 scripts/apply_popular_app_ux_fixes.py
          python3 scripts/apply_data_resilience_fixes.py
          python3 scripts/apply_build100_product_polish.py
          python3 scripts/apply_v2_all_at_once.py
          python3 scripts/apply_v2_final_polish.py
          python3 scripts/apply_v2_200_features.py
          python3 scripts/apply_v2_200_batch2.py
          python3 scripts/apply_v2_200_features_3.py
          python3 scripts/apply_v2_200_batch5.py
          python3 scripts/apply_v2_200_batch7.py
          python3 scripts/apply_v2_200_batch8.py
      - name: Verify 200-feature wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'feature center': ('Sources/Views/V2200FeatureCenter.swift', 'V2200FeatureCenterView'),
            'feature entry': ('Sources/Views/V2Personalization.swift', 'V2200FeatureCenterView()'),
            'pinning': ('Sources/Views/V2MatchExperience.swift', 'PinnedMatchStore'),
            'my scores filter': ('Sources/Views/V2MatchExperience.swift', 'مبارياتي'),
            'pinned filter': ('Sources/Views/V2MatchExperience.swift', 'مثبتة'),
            'oled runtime': ('Sources/Core/Core.swift', 'V2FeaturePreferences.oledBlack'),
            'reminders': ('Sources/Views/V2MatchExperience.swift', 'MatchReminderScheduler.schedule'),
            'event filters': ('Sources/Views/V2MatchExperience.swift', 'filteredEvents'),
            'spoiler notifications': ('Sources/Views/V2MatchExperience.swift', 'V2FeaturePreferences.spoilerMode'),
            'pinned priority': ('Sources/Views/V2HomeView.swift', 'PinnedMatchStore.contains(match.id) ? -100'),
            'pre post summary': ('Sources/Views/V2MatchExperience.swift', 'V2MatchShareTools.phaseSummary'),
            'share action': ('Sources/Views/V2MatchExperience.swift', 'V2MatchShareTools.summary'),
            'race cards': ('Sources/Views/PublicLeagueTableView.swift', 'league.raceCards'),
            'player comparison': ('Sources/Views/V2ComparisonLab.swift', 'V2PlayerComparisonLabView'),
            'league form dashboard': ('Sources/Views/V2ComparisonLab.swift', 'V2LeagueFormDashboardView'),
            'comparison entry': ('Sources/Views/V2200FeatureCenter.swift', 'V2PlayerComparisonLabView()'),
            'form entry': ('Sources/Views/V2200FeatureCenter.swift', 'V2LeagueFormDashboardView()'),
            'standing insights': ('Sources/Views/PublicLeagueTableView.swift', 'league.standingInsights'),
            'leader points gap': ('Sources/Views/PublicLeagueTableView.swift', 'pointsGapToLeader'),
            'standing share': ('Sources/Views/PublicLeagueTableView.swift', 'standingShareText'),
            'deep link router': ('Sources/Core/V2DeepLinkRouter.swift', 'V2DeepLinkRouter'),
            'root deep link wiring': ('Sources/Views/RootView.swift', '.onOpenURL'),
            'data health center': ('Sources/Views/V2DataHealthView.swift', 'data.healthCenter'),
            'data health entry': ('Sources/Views/V2200FeatureCenter.swift', 'V2DataHealthView()'),
            'backend live probe': ('Sources/Views/V2DataHealthView.swift', 'APIFootballClient.health()'),
            'public source probe': ('Sources/Views/V2DataHealthView.swift', 'ksa.1/standings'),
            'provider budget state': ('Sources/Views/V2DataHealthView.swift', 'providerBudgetRemaining'),
            'preferences backup core': ('Sources/Core/V2PreferencesBackup.swift', 'V2PreferencesBackup'),
            'preferences backup view': ('Sources/Views/V2PreferencesBackupView.swift', 'settings.backupRestore'),
            'preferences backup entry': ('Sources/Views/V2200FeatureCenter.swift', 'V2PreferencesBackupView()'),
            'backup whitelist': ('Sources/Core/V2PreferencesBackup.swift', 'stringKeys'),
            'reminder center': ('Sources/Views/V2ReminderCenterView.swift', 'reminders.center'),
            'reminder center entry': ('Sources/Views/V2200FeatureCenter.swift', 'V2ReminderCenterView()'),
            'reminder cancellation': ('Sources/Views/V2ReminderCenterView.swift', 'removePendingNotificationRequests'),
          }
          missing=[]
          for name,(path,needle) in checks.items():
              ok=needle in Path(path).read_text(encoding='utf-8')
              print(f'{name}: {"OK" if ok else "MISSING"}')
              if not ok: missing.append(name)
          feature_defs = sum(p.read_text(encoding='utf-8').count('struct V2200FeatureCenterView') for p in Path('Sources').rglob('*.swift'))
          print(f'feature center definitions: {feature_defs}')
          if feature_defs != 1: missing.append(f'duplicate feature center definitions={feature_defs}')
          if missing: raise SystemExit('missing wiring: '+', '.join(missing))
          PY
      - name: Hygiene
        run: python3 scripts/audit_commercial_hygiene.py
      - name: Core tests
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Core/PageResource.swift Sources/Core/MatchCenterProgress.swift Tests/MatchCenterProgressTests.swift -o /tmp/match-tests
          /tmp/match-tests
          swiftc -swift-version 5 Sources/Core/V2DeepLinkRouter.swift Tests/V2DeepLinkRouterTests.swift -o /tmp/deeplink-tests
          /tmp/deeplink-tests
          swiftc -swift-version 5 Sources/Core/V2PreferencesBackup.swift Tests/V2PreferencesBackupTests.swift -o /tmp/backup-tests
          /tmp/backup-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate icon and project
        run: |
          swift scripts/generate_app_icon.swift
          xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project NinetyPlus.xcodeproj -scheme NinetyPlus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          rm -rf Payload NinetyPlus-200-features.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NinetyPlus.app Payload/
          zip -qry NinetyPlus-200-features.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NinetyPlus-200-features-unsigned-IPA
          path: NinetyPlus-200-features.ipa
          retention-days: 14
